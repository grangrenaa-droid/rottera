appId: app.rottera.desktop
productName: Rottera
directories:
  output: dist
files:
  - out/**
  - package.json
  - build/icon.png
asar: true
extraResources:
  - from: mcp
    to: mcp
fileAssociations:
  - ext: rottera
    name: Roteiro Rottera
    description: Roteiro do Rottera
    icon: build/icon.ico
  - ext: rotera
    name: Roteiro (Rotera)
    description: Roteiro salvo antes do nome Rottera
    icon: build/icon.ico
  - ext: clapboard
    name: Roteiro (formato antigo)
    description: Roteiro salvo antes do nome Rotera
    icon: build/icon.ico
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  icon: build/icon.png
  category: Office
  executableName: rottera
# Microsoft Store package (npm run dist:store). The images come from build/appx (scripts/make-appx-assets.py).
# identityName, publisher and publisherDisplayName come from Partner Center: scripts/pack-store.mjs fills them in.
appx:
  applicationId: Rottera
  displayName: Rottera
  backgroundColor: transparent
  languages:
    - pt-BR
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  artifactName: ${productName}-${version}-loja.${ext}
appxManifestCreated: scripts/appx-manifest.cjs
